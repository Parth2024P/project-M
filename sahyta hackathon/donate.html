<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Donate - Demo</title>
  <link rel="stylesheet" href="qrstyle.css">
  <style>
    /* Modal overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* Modal card */
    .modal-content {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    /* Close button */
    .close {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #333;
    }

    /* QR image centered */
    #modalQR {
      display: none;
      max-width: 220px;
      width: 80%;
      margin: 20px auto;
    }

    /* Donate button */
    .donate-btn {
      background: #e52d27;
      color: #fff;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }
    .donate-btn:hover {
      background: #b71c1c;
    }
  </style>
</head>
<body>
  <div class="donate-container">
    <form class="donate-form" id="donationForm">
      <label for="fullname">FULL NAME</label>
      <div class="input-icon">
        <input type="text" id="fullname" name="fullname" required>
        <span class="icon">&#128100;</span>
      </div>

      <label for="email">EMAIL ADDRESS</label>
      <div class="input-icon">
        <input type="email" id="email" name="email" required>
        <span class="icon">&#9993;</span>
      </div>

      <label for="phone">PHONE NUMBER</label>
      <div class="input-icon">
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" pattern="[0-9]{10}" required>
        <span class="icon">&#128222;</span>
      </div>

      <label for="causes">SELECT CAUSES</label>
      <div class="input-icon">
        <select id="causes" name="causes" required>
          <option value="" disabled selected>Select</option>
          <option value="counseling">Counseling</option>
          <option value="healthcare">Health Care</option>
          <option value="maintenance">General Maintenance</option>
          <option value="girls-education">Girls Education</option>
        </select>
        <span class="icon">&#9662;</span>
      </div>

      <button type="button" class="donate-btn" id="donateBtn">DONATE NOW</button>
    </form>
  </div>

  <!-- Modal for QR -->
  <div id="modalOverlay" class="modal">
    <div class="modal-content" id="modalCard">
      <span class="close" id="closeModal">&times;</span>
      <div id="modalBody">
        <div id="modalText" style="margin-bottom:20px;">Preparing...</div>
        <img id="modalQR" src="qr.jpg" alt="QR code">
        <div id="manualConfirm" style="display:none; margin-top:20px;">
          <button id="iPaidBtn" class="donate-btn">I have paid</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const donateBtn = document.getElementById('donateBtn');
    const modal = document.getElementById('modalOverlay');
    const closeModal = document.getElementById('closeModal');
    const modalText = document.getElementById('modalText');
    const modalQR = document.getElementById('modalQR');
    const manualConfirm = document.getElementById('manualConfirm');
    const iPaidBtn = document.getElementById('iPaidBtn');

    function openModal() { modal.style.display = 'flex'; }
    function closeModalFn() { modal.style.display = 'none'; resetModal(); }
    function resetModal() {
      modalText.textContent = 'Preparing...';
      modalQR.style.display = 'none';
      manualConfirm.style.display = 'none';
    }

    closeModal.addEventListener('click', closeModalFn);
    window.addEventListener('click', (e) => { if (e.target === modal) closeModalFn(); });

    donateBtn.addEventListener('click', () => {
      const name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const cause = document.getElementById('causes').value;

      if (!name || !email || !phone || !cause) {
        alert('Please fill all fields.');
        return;
      }

      // Show QR modal
      openModal();
      modalText.textContent = 'Scan the QR code to pay';
      modalQR.style.display = 'block';
      manualConfirm.style.display = 'block';

      iPaidBtn.onclick = async () => {
        iPaidBtn.disabled = true; iPaidBtn.textContent = 'Recording...';
        const res = await fetch('/manual-confirmation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, cause })
        });
        const j = await res.json();
        modalQR.style.display = 'none';
        manualConfirm.style.display = 'none';
        modalText.textContent = '✅ Payment recorded as pending verification. Thanks a LOT!';
      };
    });
  let checkInterval;

  donateBtn.addEventListener('click', () => {
    const name = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const cause = document.getElementById('causes').value;
    const amount = document.getElementById('amount').value;

    if (!name || !email || !cause || !amount) {
      alert('Please fill all fields.');
      return;
    }

    // Show QR modal
    openModal();
    modalText.textContent = 'Scan the QR code to pay';
    modalQR.style.display = 'block';
    manualConfirm.style.display = 'none'; // hide "I Paid" button

    // Start checking backend every 5 sec
    checkInterval = setInterval(async () => {
      const res = await fetch('/check-payment-status?email=' + encodeURIComponent(email));
      const data = await res.json();
      if (data.success) {
        clearInterval(checkInterval);
        modalQR.style.display = 'none';
        modalText.textContent = '✅ Payment Done – Thanks a LOT!';
      }
    }, 5000);
  });

  function closeModalFn() {
    modal.style.display = 'none';
    resetModal();
    if (checkInterval) clearInterval(checkInterval);
  }
</script>

</body>
</html>
