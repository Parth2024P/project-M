<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Sign Up</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <div class="navbar">
    <button onclick="location.href='index2.html'">🙋 Volunteer Sign Up</button>
    <button onclick="location.href='listvol.html'">📋 Volunteer Directory</button>
    <button onclick="location.href='help.html'">🆘 Request Help</button>
    <button onclick="location.href='listhelp.html'">📑 Help Directory</button>
  </div>

  <div class="donate-container">
    <form class="donate-form" id="volunteerForm">
      <h2 style="color:#fff; text-align:center;">🙋 Become a Volunteer</h2>

      <!-- Name -->
      <label for="fullname">FULL NAME</label>
      <div class="input-icon">
        <input type="text" id="fullname" name="fullname" required>
        <span class="icon">&#128100;</span>
      </div>

      <!-- Email -->
      <label for="email">EMAIL ADDRESS</label>
      <div class="input-icon">
        <input type="email" id="email" name="email" required>
        <span class="icon">&#9993;</span>
      </div>

      <!-- Contact -->
      <label for="contact">CONTACT NUMBER</label>
      <div class="input-icon">
        <input type="tel" id="contact" name="contact" required>
        <span class="icon">&#128222;</span>
      </div>

      <!-- Country -->
      <label for="country">COUNTRY</label>
      <div class="input-icon">
        <input type="text" id="country" name="country" required>
        <span class="icon">&#127758;</span>
      </div>

      <!-- Area -->
      <label for="area">AREA</label>
      <div class="input-icon">
        <input type="text" id="area" name="area" required>
        <span class="icon">&#128205;</span>
      </div>

      <!-- Help Types -->
      <label for="helpType">WHAT HELP CAN YOU PROVIDE?</label>
      <div class="input-icon">
        <select id="helpType" name="helpType" required>
          <option value="" disabled selected>Select</option>
          <option value="counseling">Counseling</option>
          <option value="teaching">Teaching</option>
          <option value="healthcare">Health Care</option>
          <option value="food">Food Distribution</option>
          <option value="maintenance">General Maintenance</option>
        </select>
        <span class="icon">&#9662;</span>
      </div>

      <button type="submit" class="volunteerBtn"id="volunteerBtn">SIGN UP</button>
    </form>
  </div>

  <!-- Modal -->
  <div id="volunteerModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <div id="modalText">✨ Submitting...</div>
    </div>
  </div>

<script src="backend.js"> </script>

</body>
</html>
