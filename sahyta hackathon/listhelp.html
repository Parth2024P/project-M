<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Directory</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Montserrat ExtraBold', Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: 'Montserrat', sans-serif;
    }
    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #2a3d66;
      padding: 10px 0;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    .navbar button {
      background: none;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .navbar button:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    .directory-container {
      padding: 80px 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .directory-container h2 {
      text-align: center;
      color: #2a3d66;
      margin-bottom: 40px;
    }
    .directory-card {
      background-color: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      border-left: 5px solid #d44133;
    }
    .directory-card h4 {
      margin: 0 0 10px 0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <button onclick="location.href='index2.html'">🙋 Volunteer Sign Up</button>
    <button onclick="location.href='listvol.html'">📋 Volunteer Directory</button>
    <button onclick="location.href='help.html'">🆘 Request Help</button>
    <button onclick="location.href='listhelp.html'">📑 Help Directory</button>
  </div>
  <div class="directory-container">
    <h2>📑 Help Directory</h2>
    <div id="helpRequestsList"></div>
  </div>


</body>
  <script src="backend.js"></script>
</html>
